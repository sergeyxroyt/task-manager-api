[project]
name = "task-manager-api"
version = "0.1.0"
description = "Task manager API built with Django REST framework"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django==6.0.3",
    "djangorestframework==3.16.1",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "mypy==1.19.1",
    "ruff==0.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations"]
packages = ["src"]
