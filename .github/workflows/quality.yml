name: quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run typecheck
        # These are deliberately fake values: mypy-django imports config.settings,
        # but type checking does not connect to the database or need real secrets.
        env:
          SECRET_KEY: ci-fake-secret-key-not-for-production
          POSTGRES_DB: ci_fake_db
          POSTGRES_USER: ci_fake_user
          POSTGRES_PASSWORD: ci-fake-password
          POSTGRES_HOST: ci-fake-host
          POSTGRES_PORT: "5432"
        run: make typecheck

  linter:
    name: linter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run linter
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run tests
        run: make test
